services:
  ocr-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: ocr-service:latest
    container_name: ocr-service
    restart: unless-stopped
    environment:
      APP_NAME: "OCR Service"
      APP_ENV: "production"
      DEBUG: "false"
      HOST: "0.0.0.0"
      PORT: "8000"
      MAX_UPLOAD_SIZE_MB: "10"
      OCR_LANGUAGE: "vi"
      PDF_RENDER_DPI: "200"
      MIN_TEXT_LENGTH_THRESHOLD: "20"
    ports:
      - "8000:8000"
